[project]
name = "ipyapi"
version = "0.1.0"
description = "A modern Python client library for ipapi.co IP geolocation API"
authors = [
    { name = "Edo", email = "wihlarko26@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ip", "geolocation", "ipapi", "api", "location", "geoip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]

[project.urls]
Homepage = "https://github.com/wihlarkop/ipyapi"
Documentation = "https://github.com/wihlarkop/ipyapi#readme"
Repository = "https://github.com/wihlarkop/ipyapi"
Issues = "https://github.com/wihlarkop/ipyapi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ipyapi"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=ipyapi --cov-report=term-missing"
